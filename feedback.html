<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERKESO KL - Feedback</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --perkeso-blue: #0088cc;
            --perkeso-green: #8cc63f;
            --star-yellow: #ffc107;
            --star-gray: #dee2e6;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .logo-container {
            max-width: 200px;
            margin: 2rem auto;
        }

        .logo-container {
            max-width: 200px;
            margin: 2rem auto;
			margin-top: 0px;
			margin-bottom: 0px;
        }

        .feedback-illustration {
            max-width: 250px;
            margin: 2rem auto;
        }

        @media (max-width: 576px) {
            .feedback-illustration {
                max-width: 180px;
                margin: 1rem auto;
            }
        }

        .feedback-text {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 2rem;
            padding: 0 1rem;
			font-weight: bold;
        }

        .feedback-subtitle {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .star-rating {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .star {
            width: 40px;
            height: 40px;
            fill: var(--star-yellow);
        }

        .star:last-child {
            fill: var(--star-gray);
        }

        .submit-btn {
            background-color: var(--perkeso-blue);
            color: white;
            font-size: 1.2rem;
            padding: 1rem;
            border-radius: 8px;
            width: calc(100% - 2rem);
            max-width: 400px;
            margin: 0 auto;
            border: none;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
        }

        .submit-btn:hover {
            background-color: #0077b3;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .container {
            max-width: 600px;
            padding: 0;
        }

        @media (max-width: 576px) {
            .feedback-text {
                font-size: 1rem;
                margin-bottom: 1.5rem;
				font-weight: bold;
            }

            .feedback-subtitle {
                font-size: 1rem;
                margin-bottom: 1rem;
            }

            .star {
                width: 35px;
                height: 35px;
            }

            .submit-btn {
                font-size: 1.1rem;
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="perkeso-logo.png" alt="PERKESO Logo" class="img-fluid">
        </div>

        <div class="feedback-illustration">
            <img src="feedback-illustration.png" alt="Feedback Illustration" class="img-fluid">
        </div>
        
        <div class="feedback-text">
            Terima kasih atas kunjungan anda ke<br>
            cawangan kami. Maklum balas anda<br>
            adalah penting bagi kami.
        </div>
        
        <div class="feedback-subtitle">
            Sila nilaikan perkhidmatan kami.
        </div>
        
        <div class="star-rating">
            <svg class="star" viewBox="0 0 24 24">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
            <svg class="star" viewBox="0 0 24 24">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
            <svg class="star" viewBox="0 0 24 24">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
            <svg class="star" viewBox="0 0 24 24">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
            <svg class="star" viewBox="0 0 24 24">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
        </div>

        <button type="submit" class="submit-btn">Hantar</button>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
